<title data-own="">眼動溝通板</title>
<style data-own="">
:root{
  --bg:#14202C; --surface:#1F3042; --surface-2:#2A4058; --text:#F3F6F9; --muted:#A3B3C4; --line:#35506B;
  --yes:#2A9B71; --no:#C4651F; --call:#D63B3B;
  --gap:clamp(10px,1.5vw,20px); --radius:22px; --spell:#2BB3A3; --on-spell:#06201D;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: light){ :root[data-board="auto"]:not([data-theme="dark"]){
  --bg:#E6ECF2; --surface:#FFFFFF; --surface-2:#EEF3F8; --text:#13202C; --muted:#56687A; --line:#C3D0DC;
} }
:root[data-board="auto"][data-theme="dark"]{
  --bg:#14202C; --surface:#1F3042; --surface-2:#2A4058; --text:#F3F6F9; --muted:#A3B3C4; --line:#35506B;
}
:root[data-board="light"],:root[data-board="auto"][data-theme="light"]{
  --bg:#E6ECF2; --surface:#FFFFFF; --surface-2:#EEF3F8; --text:#13202C; --muted:#56687A; --line:#C3D0DC;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  background:var(--bg); color:var(--text); overflow:hidden; overscroll-behavior:none;
  font-family:"PingFang TC","Heiti TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;
  -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; touch-action:manipulation;
  -webkit-tap-highlight-color:transparent;
}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}

/* ---------- 主版面 ---------- */
.app{
  height:100%; display:grid; gap:var(--gap); padding:var(--gap);
  padding-left:max(var(--gap),env(safe-area-inset-left,0px)); padding-right:max(var(--gap),env(safe-area-inset-right,0px));
  grid-template-columns:1fr minmax(170px,21vw);
  grid-template-rows:auto 1fr;
  grid-template-areas:"top top" "board side";
}
@media (orientation:portrait){
  .app{grid-template-columns:1fr; grid-template-rows:auto 1fr auto; grid-template-areas:"top" "board" "side"}
}
.top{grid-area:top; display:flex; gap:var(--gap); align-items:stretch}
.tabs{flex:1; display:flex; gap:var(--gap)}
.tab{
  flex:1; min-height:clamp(64px,9vh,96px); border:0; border-radius:var(--radius);
  background:var(--surface); box-shadow:inset 0 -8px 0 var(--cat);
  display:flex; align-items:center; justify-content:center; gap:.4em;
  font-size:clamp(1.2rem,2.4vw,2rem); font-weight:700;
}
.tab[aria-selected="true"]{background:var(--cat); color:var(--on-cat); box-shadow:none}
.meta{display:flex; flex-direction:column; align-items:flex-end; justify-content:space-between; min-width:7.5em}
.clock{font-size:clamp(1rem,1.6vw,1.35rem); color:var(--muted); font-variant-numeric:tabular-nums; white-space:nowrap}
.gear{
  position:relative; border:1px solid var(--line); background:transparent; color:var(--muted);
  border-radius:14px; padding:.35em .7em; font-size:.95rem; overflow:hidden; white-space:nowrap;
}
.gear::after{content:""; position:absolute; inset:auto 0 0 0; height:4px; background:var(--text); transform:scaleX(0); transform-origin:left}
.gear.holding::after{transform:scaleX(1); transition:transform 1.2s linear}

.board{grid-area:board; display:grid; gap:var(--gap); min-height:0}
.side{grid-area:side; display:grid; gap:var(--gap); grid-template-rows:1fr 1fr 1.25fr}
@media (orientation:portrait){ .side{grid-template-rows:none; grid-template-columns:1fr 1fr 1.25fr; height:clamp(110px,15vh,170px)} }

.target{position:relative; overflow:hidden; border:0; border-radius:var(--radius); min-width:0; min-height:0}
.target::after{
  content:""; position:absolute; left:0; right:0; bottom:0; height:12px;
  background:var(--cat,var(--text)); transform:scaleX(0); transform-origin:left; pointer-events:none;
}
.target.quick::after,.target.on-fill::after{background:rgba(255,255,255,.85)}
.target.dwelling::after{transform:scaleX(1); transition:transform var(--dwell,1500ms) linear}
.target:focus-visible{outline:4px solid var(--text); outline-offset:3px}

.cell{
  background:var(--surface); box-shadow:inset 0 10px 0 var(--cat);
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:.15em; padding:.6em .4em .4em;
}
.cell:active{background:var(--surface-2)}
.cell .ico{font-size:clamp(2rem,5.2vh,3.6rem); line-height:1.1}
.cell .lbl{font-size:clamp(1.25rem,3.4vh,2.3rem); font-weight:700; line-height:1.25; text-align:center; word-break:keep-all; overflow-wrap:anywhere}

.quick{color:#fff; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:.1em; font-weight:800}
.quick .ico{font-size:clamp(1.8rem,4.6vh,3.2rem)}
.quick .lbl{font-size:clamp(1.6rem,4.4vh,3rem)}
.q-yes{background:var(--yes)} .q-no{background:var(--no)} .q-call{background:var(--call)}

.cooling .board,.cooling .side,.cooling .tabs{opacity:.4; transition:opacity .2s}

/* ---------- 注音拼字板 ---------- */
.board.spell{grid-template-columns:1fr; grid-template-rows:minmax(0,.95fr) minmax(0,.8fr) minmax(0,3.1fr) minmax(0,.85fr)}
.comp{
  background:var(--surface); border-radius:var(--radius); padding:.35em .6em; overflow:hidden;
  font-size:clamp(1.7rem,5vh,3.2rem); font-weight:700; line-height:1.3; word-break:break-all;
  box-shadow:inset 0 0 0 3px var(--line);
}
.comp .zy{color:var(--spell)}
.comp .cur{color:var(--spell); text-decoration:underline; text-underline-offset:.18em; text-decoration-thickness:3px}
.comp .caret{display:inline-block; width:3px; height:1.1em; background:var(--text); vertical-align:-.15em; margin-left:2px}
.comp .ph{color:var(--muted); font-weight:500; font-size:.75em}
.rowgrid{display:grid; gap:var(--gap); min-height:0}
.cands{grid-template-columns:repeat(7,1fr)}
.cand{background:var(--surface); box-shadow:inset 0 8px 0 var(--spell); font-size:clamp(1.4rem,4.4vh,2.8rem); font-weight:700; padding:0 .2em; white-space:nowrap; text-overflow:clip}
.cand.more{font-size:clamp(1.05rem,2.6vh,1.6rem); color:var(--muted)}
.cand.warn{box-shadow:inset 0 8px 0 var(--call)}
.cand.armed{background:var(--call); color:#fff}
.cand.empty{background:transparent; box-shadow:inset 0 0 0 2px var(--line)}
.keys{min-height:0}
.key{background:var(--surface); box-shadow:inset 0 8px 0 var(--kc,var(--line)); font-size:clamp(2rem,6.6vh,4.4rem); font-weight:700}
.keys.full .key{font-size:clamp(1.4rem,4.4vh,2.8rem)}
.key.k-i{--kc:#2BB3A3} .key.k-m{--kc:#E8A33A} .key.k-f{--kc:#9B7BEA}
.key.back{font-size:clamp(1.2rem,3.4vh,2rem); color:var(--muted)}
.grp{background:var(--surface); box-shadow:inset 0 8px 0 var(--kc,var(--spell)); font-size:clamp(1.6rem,5.2vh,3.2rem); font-weight:700; line-height:1.35; letter-spacing:.08em; white-space:pre-line}
.bottom{grid-template-columns:repeat(5,1fr) 1.25fr 1.8fr}
.tone{background:var(--surface-2); font-size:clamp(1.8rem,5.4vh,3.4rem); font-weight:800}
.tone small{display:block; font-size:.4em; font-weight:500; color:var(--muted); letter-spacing:0}
.del{background:var(--surface-2); font-size:clamp(1.2rem,3.4vh,2rem); font-weight:700}
.say{background:var(--spell); color:var(--on-spell); font-size:clamp(1.3rem,3.8vh,2.3rem); font-weight:800}
.target.flash{outline:5px solid var(--spell); outline-offset:-5px}
@media (orientation:portrait){ .del,.say{font-size:clamp(1rem,2.3vh,1.6rem); white-space:nowrap} .bottom{grid-template-columns:repeat(5,1fr) 1.3fr 1.9fr} .cands{grid-template-columns:repeat(4,1fr); grid-auto-rows:1fr} .board.spell{grid-template-rows:minmax(0,1fr) minmax(0,1.3fr) minmax(0,3.4fr) minmax(0,.8fr)} }


/* ---------- 顯示需求的全螢幕畫面 ---------- */
.overlay{
  position:fixed; inset:0; z-index:20; background:var(--bg);
  box-shadow:inset 0 0 0 clamp(14px,2.2vw,26px) var(--cat);
  display:grid; grid-template-rows:1fr auto; padding:calc(clamp(14px,2.2vw,26px) + var(--gap));
  padding-top:calc(clamp(14px,2.2vw,26px) + var(--gap) + env(safe-area-inset-top,0px));
  padding-bottom:calc(clamp(14px,2.2vw,26px) + var(--gap) + env(safe-area-inset-bottom,0px));
}
.overlay[hidden]{display:none}
.ov-msg{display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; gap:.2em}
.ov-ico{font-size:clamp(4rem,14vh,9rem); line-height:1}
.ov-text{font-size:clamp(2.8rem,10vh,7.5rem); font-weight:800; line-height:1.15; max-width:16em}
.ov-time{color:var(--muted); font-size:clamp(1rem,2.2vh,1.4rem); margin-top:.6em}
.ov-actions{display:grid; grid-template-columns:1fr 1fr; gap:var(--gap); height:clamp(96px,17vh,170px)}
.ov-btn{background:var(--surface); font-size:clamp(1.5rem,4vh,2.5rem); font-weight:700; display:flex; align-items:center; justify-content:center; gap:.4em}
.ov-done{background:var(--text); color:var(--bg)}
.ov-done::after{background:var(--bg) !important}
.countdown{position:absolute; --f:clamp(14px,2.2vw,26px); left:var(--f); right:var(--f); bottom:calc(var(--f) + env(safe-area-inset-bottom,0px)); height:6px; background:var(--muted); transform-origin:left}
.alarm{animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:inset 0 0 0 clamp(26px,4vw,48px) var(--cat)}}
@media (prefers-reduced-motion:reduce){.alarm{animation:none}.target.dwelling::after,.gear.holding::after{transition-duration:1ms}}

/* ---------- 照顧者設定 ---------- */
.sheet{position:fixed; inset:0; z-index:30; background:var(--bg); overflow-y:auto; -webkit-user-select:text; user-select:text; touch-action:auto}
.sheet[hidden]{display:none}
.sheet-head{
  position:sticky; top:0; z-index:1; background:var(--bg); border-bottom:1px solid var(--line);
  display:flex; align-items:center; justify-content:space-between;
  padding:calc(14px + env(safe-area-inset-top,0px)) 24px 14px;
}
.sheet-head h1{font-size:1.5rem; margin:0}
.sheet-body{max-width:860px; margin:0 auto; padding:8px 24px 64px}
.sheet h2{font-size:1.15rem; margin:30px 0 10px}
.row{display:flex; align-items:center; justify-content:space-between; gap:16px; padding:12px 0; border-bottom:1px solid var(--line); font-size:1.05rem}
.row small{display:block; color:var(--muted); font-size:.88rem; margin-top:2px}
.row input[type=range]{width:min(260px,40vw)}
.row select,.edit input,.btn{background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:.55em .8em}
.btn{font-weight:600}
.btn-primary{background:var(--text); color:var(--bg); border-color:var(--text)}
.btn-danger{color:var(--call)}
.seg{display:flex; gap:8px; flex-wrap:wrap}
.seg .btn[aria-pressed="true"]{background:var(--text); color:var(--bg)}
.edit{display:grid; grid-template-columns:4.2em 1fr auto auto auto; gap:8px; align-items:center; margin:8px 0}
.edit input.emoji{text-align:center; font-size:1.4rem; padding:.3em}
.actions{display:flex; gap:10px; flex-wrap:wrap; margin-top:12px}
.log{list-style:none; padding:0; margin:0; font-size:1rem}
.log li{display:flex; gap:14px; padding:8px 0; border-bottom:1px solid var(--line)}
.log time{color:var(--muted); font-variant-numeric:tabular-nums; min-width:9em}
.note{color:var(--muted); font-size:.92rem; line-height:1.6}
input[type=checkbox]{width:28px; height:28px}

.toast{
  position:fixed; left:50%; bottom:calc(24px + env(safe-area-inset-bottom,0px)); transform:translateX(-50%);
  background:var(--text); color:var(--bg); padding:.7em 1.2em; border-radius:14px; font-size:1.05rem; z-index:40;
  opacity:0; pointer-events:none; transition:opacity .2s;
}
.toast.show{opacity:1}
</style>
</head>
<body>
<div data-own="" class="app" id="app">
  <header class="top">
    <nav class="tabs" id="tabs" role="tablist" aria-label="需求分類"></nav>
    <div class="meta">
      <div class="clock" id="clock"></div>
      <button class="gear" id="gear" aria-label="設定（照顧者長按開啟）">⚙︎ 長按設定</button>
    </div>
  </header>
  <main class="board" id="board" aria-live="polite"></main>
  <aside class="side" id="side" aria-label="快速回應"></aside>
</div>

<section data-own="" class="overlay" id="overlay" hidden="" aria-modal="true" role="dialog">
  <div class="ov-msg">
    <div class="ov-ico" id="ovIco"></div>
    <div class="ov-text" id="ovText"></div>
    <div class="ov-time" id="ovTime"></div>
  </div>
  <div class="ov-actions">
    <button class="target ov-btn" id="ovRepeat">🔊 再說一次</button>
    <button class="target ov-btn ov-done" id="ovDone">✓ 完成</button>
  </div>
  <div class="countdown" id="countdown"></div>
</section>

<section data-own="" class="sheet" id="settings" hidden="" aria-label="設定">
  <div class="sheet-head">
    <h1>照顧者設定</h1>
    <button class="btn btn-primary" id="closeSettings">完成</button>
  </div>
  <div class="sheet-body">
    <h2>語音</h2>
    <div class="row"><label for="sSpeech">選擇後朗讀出聲</label><input type="checkbox" id="sSpeech"></div>
    <div class="row"><label for="sVoice">聲音</label><select id="sVoice"></select></div>
    <div class="row"><label for="sRate">語速 <small id="sRateVal"></small></label><input type="range" id="sRate" min="0.5" max="1.4" step="0.05"></div>

    <h2>選擇與防誤觸</h2>
    <div class="row"><label for="sOverlay">需求畫面停留秒數<small>「呼叫照顧者」會持續提醒，直到按完成</small></label><span><input type="range" id="sOverlay" min="3" max="20" step="1"> <b id="sOverlayVal"></b></span></div>
    <div class="row"><label for="sCooldown">完成後暫停選擇<small>避免視線停在原處時連續觸發</small></label><span><input type="range" id="sCooldown" min="300" max="4000" step="100"> <b id="sCooldownVal"></b></span></div>
    <div class="row"><label for="sDwell">頁面內凝視選擇<small>只在系統「停留控制」關閉、而游標停留能被頁面偵測時開啟</small></label><input type="checkbox" id="sDwell"></div>
    <div class="row"><label for="sDwellMs">凝視選擇時間</label><span><input type="range" id="sDwellMs" min="600" max="4000" step="100"> <b id="sDwellMsVal"></b></span></div>

    <h2>注音拼字</h2>
    <div class="row"><span>鍵盤<small>分組：先選一組再選注音，按鍵大、較不易選錯</small></span><div class="seg" id="sKbd">
      <button class="btn" data-v="group">分組（按鍵較大）</button>
      <button class="btn" data-v="full">完整鍵盤</button>
    </div></div>
    <div class="row"><span>選字習慣<small>常選的字詞會自動排到前面</small></span><button class="btn btn-danger" id="clearFreq">清除選字習慣</button></div>

    <h2>外觀</h2>
    <div class="row"><span>畫面</span><div class="seg" id="sTheme">
      <button class="btn" data-v="auto">跟隨裝置</button>
      <button class="btn" data-v="dark">暗色（夜間不刺眼）</button>
      <button class="btn" data-v="light">亮色</button>
    </div></div>

    <h2>編輯按鈕</h2>
    <div class="seg" id="editCats"></div>
    <div id="editList"></div>
    <div class="actions"><button class="btn" id="addItem">＋ 新增按鈕</button></div>
    <p class="note">每個分類最多 12 個按鈕。文字就是朗讀的內容，可以寫成完整句子，例如「請幫我抽痰」。</p>

    <h2>最近的需求紀錄</h2>
    <ul class="log" id="log"></ul>
    <div class="actions"><button class="btn btn-danger" id="clearLog">清除紀錄</button></div>

    <h2>備份</h2>
    <div class="actions">
      <button class="btn" id="offlineBtn">下載離線版（HTML）</button>
      <button class="btn" id="exportBtn">匯出設定檔</button>
      <label class="btn" for="importFile">匯入設定檔</label>
      <input type="file" id="importFile" accept="application/json,.json" hidden="">
      <button class="btn btn-danger" id="resetBtn">還原預設按鈕</button>
    </div>
    <p class="note">建議 iPad 設定：輔助使用 → 眼動追蹤（開啟並完成校正、開啟停留控制）；顯示與亮度 → 自動鎖定 → 永不；輔助使用 → 引導使用模式，把畫面鎖在本程式。</p>
  </div>
</section>

<div data-own="" class="toast" id="toast" role="status"></div>

function gridFor(n){
  let c, r;
  if(n<=2){c=2;r=1}else if(n<=4){c=2;r=2}else if(n<=6){c=3;r=2}else if(n<=9){c=3;r=3}else{c=4;r=3}
  if(matchMedia("(orientation:portrait)").matches && c>r) [c,r]=[r,c];
  return [c,r];
}

/* ---------- 語音與提醒聲 ---------- */
let voices = [];
function loadVoices(){
  if(!("speechSynthesis" in window)) return;
  voices = speechSynthesis.getVoices().filter(v => /^zh/i.test(v.lang));
  const sel = $("sVoice"); sel.textContent = "";
  const auto = new Option("自動（優先台灣中文）", ""); sel.add(auto);
  voices.forEach(v => sel.add(new Option(`${v.name}（${v.lang}）`, v.voiceURI)));
  sel.value = state.settings.voiceURI;
}
function pickVoice(){
  if(state.settings.voiceURI){ const v = voices.find(v => v.voiceURI === state.settings.voiceURI); if(v) return v; }
  return voices.find(v => /zh[-_]TW/i.test(v.lang)) || voices.find(v => /zh/i.test(v.lang)) || null;
}
function speak(text){
  if(!state.settings.speech || !("speechSynthesis" in window)) return;
  try{
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    const v = pickVoice(); if(v) u.voice = v;
    u.lang = v ? v.lang : "zh-TW"; u.rate = state.settings.rate;
    speechSynthesis.speak(u);
  }catch(e){}
}
let actx = null;
function beep(){
  try{
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    if(actx.state === "suspended") actx.resume();
    const t = actx.currentTime;
    [[988,0],[784,0.28]].forEach(([f,d]) => {
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = "sine"; o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, t+d); g.gain.exponentialRampToValueAtTime(0.5, t+d+0.03);
      g.gain.exponentialRampToValueAtTime(0.0001, t+d+0.25);
      o.connect(g).connect(actx.destination); o.start(t+d); o.stop(t+d+0.27);
    });
  }catch(e){}
}

/* ---------- 注音拼字 ---------- */
const ZC = window.ZHUYIN_CHARS || {}, ZP = window.ZHUYIN_PHRASES || {};
const INITIALS = "ㄅㄆㄇㄈㄉㄊㄋㄌㄍㄎㄏㄐㄑㄒㄓㄔㄕㄖㄗㄘㄙ", MEDIALS = "ㄧㄨㄩ", FINALS = "ㄚㄛㄜㄝㄞㄟㄠㄡㄢㄣㄤㄥㄦ";
const MARK = {1:"", 2:"ˊ", 3:"ˇ", 4:"ˋ", 5:"˙"};
const GROUPS = [
  {label:"ㄅㄆㄇㄈ\nㄉㄊㄋㄌ", keys:[..."ㄅㄆㄇㄈㄉㄊㄋㄌ"], kc:"#2BB3A3"},
  {label:"ㄍㄎㄏ\nㄐㄑㄒ", keys:[..."ㄍㄎㄏㄐㄑㄒ"], kc:"#2BB3A3"},
  {label:"ㄓㄔㄕㄖ\nㄗㄘㄙ", keys:[..."ㄓㄔㄕㄖㄗㄘㄙ"], kc:"#2BB3A3"},
  {label:"ㄧㄨㄩ\nㄚㄛㄜㄝ", keys:[..."ㄧㄨㄩㄚㄛㄜㄝ"], kc:"#E8A33A"},
  {label:"ㄞㄟㄠㄡ\nㄢㄣㄤㄥㄦ", keys:[..."ㄞㄟㄠㄡㄢㄣㄤㄥㄦ"], kc:"#9B7BEA"},
  {label:"，。？！\n空格", keys:["，","。","？","！"," "], kc:"#8A9AAD", punct:true}
];
const SP = {text:"", pending:[], cur:{i:"",m:"",f:""}, page:0, group:-1, clearArm:0};
let userFreq = (() => { try{ return JSON.parse(localStorage.getItem(KEY+":freq")) || {}; }catch(e){ return {}; } })();
function saveFreq(){ try{ localStorage.setItem(KEY+":freq", JSON.stringify(userFreq)); }catch(e){} }

const cCache = new Map(), pCache = new Map();
function charsOf(b){
  if(!cCache.has(b)){ const out=[]; for(const m of (ZC[b]||"").matchAll(/([\u4e00-\u9fff])(\d)/g)) out.push({w:m[1], ts:m[2]}); cCache.set(b,out); }
  return cCache.get(b);
}
function phrasesOf(k){
  if(!pCache.has(k)){ const out=[]; for(const m of (ZP[k]||"").matchAll(/([\u4e00-\u9fff]+)(\d+)/g)) out.push({w:m[1], ts:m[2]}); pCache.set(k,out); }
  return pCache.get(k);
}
const curBody = () => SP.cur.i + SP.cur.m + SP.cur.f;
function seq(){ const s = SP.pending.map(p => ({b:p.b, t:p.t})); const cb = curBody(); if(cb) s.push({b:cb, t:0}); return s; }
const tonesOk = (ts, sq) => sq.every((x,i) => !x.t || +ts[i] === x.t);
function rank(list){ return list.map((x,i) => [x,i]).sort((a,b) => ((userFreq[b[0].w]||0) - (userFreq[a[0].w]||0)) || a[1]-b[1]).map(a => a[0]); }
function getCands(){
  const sq = seq(); if(!sq.length) return [];
  const out = [], seen = new Set();
  const push = (w,n) => { const k = w+"|"+n; if(!seen.has(k)){ seen.add(k); out.push({w,n}); } };
  for(let n = Math.min(sq.length,4); n >= 2; n--){
    const sub = sq.slice(0,n), list = phrasesOf(sub.map(x => x.b).join(" "));
    let ok = list.filter(p => tonesOk(p.ts, sub)); if(!ok.length) ok = list;
    rank(ok).forEach(p => push(p.w, n));
  }
  const f = sq[0], cs = charsOf(f.b); let ok = cs.filter(c => !f.t || +c.ts === f.t); if(!ok.length) ok = cs;
  rank(ok).forEach(c => push(c.w, 1));
  return out;
}
function bestChar(b,t){ const cs = charsOf(b); const c = cs.find(x => !t || +x.ts === t) || cs[0]; return c ? c.w : ""; }
function consume(n){
  if(n <= SP.pending.length) SP.pending.splice(0,n);
  else { SP.pending = []; SP.cur = {i:"",m:"",f:""}; }
}
function pickCand(c){
  SP.text += c.w; consume(c.n);
  userFreq[c.w] = (userFreq[c.w]||0) + 1; saveFreq();
  SP.page = 0;
}
function commitAll(){
  let guard = 20;
  while(seq().length && guard--){
    const c = getCands()[0];
    if(c){ SP.text += c.w; consume(c.n); }
    else { const p = SP.pending.shift(); if(p) SP.text += p.b + MARK[p.t]; else { SP.text += curBody(); SP.cur = {i:"",m:"",f:""}; } }
  }
}
function inputSymbol(k){
  if(INITIALS.includes(k)) SP.cur.i = k; else if(MEDIALS.includes(k)) SP.cur.m = k; else SP.cur.f = k;
  SP.page = 0;
}
function inputTone(t){
  const b = curBody(); if(!b) return false;
  SP.pending.push({b, t}); SP.cur = {i:"",m:"",f:""}; SP.page = 0;
  if(SP.pending.length > 6){ const p = SP.pending.shift(); SP.text += bestChar(p.b,p.t) || (p.b+MARK[p.t]); }
  return true;
}
function inputPunct(k){ commitAll(); SP.text += k; SP.page = 0; }
function backspace(){
  const c = SP.cur;
  if(c.f) c.f = ""; else if(c.m) c.m = ""; else if(c.i) c.i = "";
  else if(SP.pending.length) SP.pending.pop();
  else SP.text = Array.from(SP.text).slice(0,-1).join("");
  SP.page = 0;
}
const displayText = () => SP.text + SP.pending.map(p => p.b + MARK[p.t]).join("") + curBody();
const sayText = () => SP.text + SP.pending.map(p => bestChar(p.b,p.t)).join("") + (curBody() ? bestChar(curBody(),0) : "");

let lastKey = 0;
function keyBind(el, fn){
  bindTarget(el, () => {
    const now = Date.now(); if(now - lastKey < 300) return; lastKey = now;
    el.classList.add("flash"); setTimeout(() => el.classList.remove("flash"), 260);
    fn();
  });
}
function mk(cls, html, fn){
  const b = document.createElement("button"); b.className = "target " + cls;
  if(typeof html === "string") b.textContent = html; else b.append(...html);
  if(fn) keyBind(b, fn);
  return b;
}
function refresh(){ renderSpell(); }

function renderSpell(){
  boardEl.style.gridTemplateColumns = ""; boardEl.style.gridTemplateRows = "";
  boardEl.textContent = "";
  // 輸入內容
  const comp = document.createElement("div"); comp.className = "comp"; comp.setAttribute("aria-live","polite");
  if(!displayText()){
    const ph = document.createElement("span"); ph.className = "ph"; ph.textContent = "用注音拼出想說的話，再選「說出來」";
    comp.append(ph);
  }else{
    comp.append(document.createTextNode(SP.text));
    if(SP.pending.length){ const z = document.createElement("span"); z.className="zy"; z.textContent = SP.pending.map(p => p.b+MARK[p.t]).join(" "); comp.append(z); }
    if(curBody()){ const c = document.createElement("span"); c.className="cur"; c.textContent = (SP.pending.length?" ":"") + curBody(); comp.append(c); }
  }
  if(displayText()){ const caret = document.createElement("span"); caret.className = "caret"; comp.append(caret); }
  boardEl.appendChild(comp);
  requestAnimationFrame(() => { comp.scrollTop = comp.scrollHeight; });

  // 候選字詞列
  const portrait = matchMedia("(orientation:portrait)").matches;
  const slots = portrait ? 7 : 6;
  const row = document.createElement("div"); row.className = "rowgrid cands";
  const cands = getCands();
  if(cands.length){
    const pages = Math.max(1, Math.ceil(cands.length / slots)); if(SP.page >= pages) SP.page = 0;
    const shown = cands.slice(SP.page*slots, SP.page*slots + slots);
    shown.forEach(c => row.appendChild(mk("cand", c.w, () => { pickCand(c); refresh(); })));
    for(let i = shown.length; i < slots; i++){ const e = document.createElement("div"); e.className = "cand empty target"; row.appendChild(e); }
    row.appendChild(pages > 1 ? mk("cand more", `更多 ${SP.page+1}/${pages}`, () => { SP.page = (SP.page+1) % pages; refresh(); })
                              : Object.assign(document.createElement("div"), {className:"cand empty target"}));
  }else{
    const armed = Date.now() - SP.clearArm < 4000;
    ["，","。","？","！"].forEach(k => row.appendChild(mk("cand", k, () => { inputPunct(k); refresh(); })));
    row.appendChild(mk("cand", "空格", () => { inputPunct(" "); refresh(); }));
    if(!portrait) row.appendChild(Object.assign(document.createElement("div"), {className:"cand empty target"}));
    row.appendChild(mk("cand warn" + (armed ? " armed" : ""), armed ? "確認清除" : "清除", () => {
      if(!displayText()) return;
      if(Date.now() - SP.clearArm < 4000){ SP.text=""; SP.pending=[]; SP.cur={i:"",m:"",f:""}; SP.clearArm = 0; }
      else { SP.clearArm = Date.now(); setTimeout(() => { if(mode==="spell" && !overlayOpen) refresh(); }, 4100); }
      refresh();
    }));
  }
  boardEl.appendChild(row);

  // 鍵盤
  const keys = document.createElement("div"); keys.className = "rowgrid keys";
  const typeOf = k => INITIALS.includes(k) ? "k-i" : MEDIALS.includes(k) ? "k-m" : "k-f";
  keys.classList.toggle("full", state.settings.kbd === "full");
  if(state.settings.kbd === "full"){
    keys.style.gridTemplateColumns = portrait ? "repeat(6,1fr)" : "repeat(8,1fr)";
    keys.style.gridAutoRows = "1fr";
    [...INITIALS, ...MEDIALS, ...FINALS].forEach(k => keys.appendChild(mk("key " + typeOf(k), k, () => { inputSymbol(k); refresh(); })));
  }else if(SP.group < 0){
    keys.style.gridTemplateColumns = portrait ? "repeat(2,1fr)" : "repeat(3,1fr)";
    keys.style.gridAutoRows = "1fr";
    GROUPS.forEach((g,gi) => { const b = mk("grp", g.label, () => { SP.group = gi; refresh(); }); b.style.setProperty("--kc", g.kc); keys.appendChild(b); });
  }else{
    const g = GROUPS[SP.group];
    keys.style.gridTemplateColumns = portrait ? "repeat(4,1fr)" : "repeat(5,1fr)";
    keys.style.gridAutoRows = "1fr";
    g.keys.forEach(k => {
      const label = k === " " ? "空格" : k;
      const b = mk("key " + (g.punct ? "" : typeOf(k)), label, () => { if(g.punct) inputPunct(k); else inputSymbol(k); SP.group = -1; refresh(); });
      if(g.punct) b.style.setProperty("--kc", g.kc);
      keys.appendChild(b);
    });
    keys.appendChild(mk("key back", "↩ 返回", () => { SP.group = -1; refresh(); }));
  }
  boardEl.appendChild(keys);

  // 聲調、刪除、說出來
  const bottom = document.createElement("div"); bottom.className = "rowgrid bottom";
  [[1,"ˉ","一聲"],[2,"ˊ","二聲"],[3,"ˇ","三聲"],[4,"ˋ","四聲"],[5,"˙","輕聲"]].forEach(([t,m,n]) => {
    const sm = document.createElement("small"); sm.textContent = n;
    bottom.appendChild(mk("tone", [document.createTextNode(m), sm], () => { if(inputTone(t)) refresh(); }));
  });
  bottom.appendChild(mk("del", "⌫ 刪除", () => { backspace(); refresh(); }));
  bottom.appendChild(mk("say", "🔊 說出來", () => {
    const d = displayText().trim(); if(!d) return;
    activate({icon:"💬", text:d, say:sayText(), color:"#2BB3A3"});
  }));
  boardEl.appendChild(bottom);
}

/* ---------- 啟動 ---------- */
if("speechSynthesis" in window){ loadVoices(); speechSynthesis.onvoiceschanged = loadVoices; }
applyTheme(); renderTabs(); renderBoard(); renderSide();
matchMedia("(orientation:portrait)").addEventListener("change", renderBoard);
document.addEventListener("gesturestart", e => e.preventDefault());
})();
</script></body></html>
